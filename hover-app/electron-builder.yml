appId: com.hoverai.app
productName: HoverAI
copyright: Copyright © 2025 HoverAI

# Where to look for icons and other build assets
directories:
  buildResources: resources
  output: dist

# Files to include in the app bundle
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/icons-tmp/**'
  - '!resources/icon_1024.png'
  - '!resources/icon_build.png'

# Unpack native modules from asar so they can load their .node binaries
asarUnpack:
  - node_modules/@nut-tree-fork/**

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: HoverAI needs microphone access for voice commands.
    - NSScreenCaptureDescription: HoverAI needs screen capture to see your current context.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false

dmg:
  artifactName: HoverAI-${version}-mac-${arch}.${ext}
  title: HoverAI ${version}

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  icon: resources/icon.ico
  executableName: HoverAI
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: HoverAI-${version}-win-setup.${ext}
  shortcutName: HoverAI
  uninstallDisplayName: HoverAI
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  icon: resources/linux-icons
  executableName: hoverai
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: HoverAI <hello@hoverai.app>
  category: Utility
  description: AI-powered voice assistant with live screen context

appImage:
  artifactName: HoverAI-${version}-linux.${ext}

# ── Build config ──────────────────────────────────────────────────────────────
npmRebuild: false

# Disable auto-update publishing for now (no update server yet)
publish: null
