[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[project]
name = "hover-ai-backend"
version = "0.1.0"
description = "Hover AI FastAPI backend — African-language STT benchmarking & UI beacon assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
hover     = "app._scripts:run"
hover-dev = "app._scripts:run_dev"
setup-db  = "scripts.setup_db:main_sync"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
